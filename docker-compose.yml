version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: coveme-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=SuperSecret123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - coveme-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P SuperSecret123! -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  sqlserver_data:

networks:
  coveme-network:
    driver: bridge 